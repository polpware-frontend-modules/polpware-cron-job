<form [formGroup]="form" (ngSubmit)="confirm()">
    <div class="mb-3 row" *ngIf="visibiltyCfg.scheduleType">
        <label class="col-12 col-md-4 col-form-label">
            {{'polpCronJob.scheduleType' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <div class="form-check form-check-inline"
                 *ngFor="let opt of scheduleTypeOptions;let i=index">
                <input class="form-check-input"
                       formControlName="scheduleType"
                       type="radio"
                       id="{{prefix + 'schedule-type-opt-' + i}}"
                       value="{{opt.value}}">
                <label class="form-check-label"
                       for="{{prefix + 'schedule-type-opt-' + i}}">
                    {{opt.text | cronJobHyperTrans}}
                </label>
            </div>
            <div class="d-block form-text text-warning my-1"
                 *ngIf="form.hasError('scheduleType') && (form.get('scheduleType').dirty || form.get('scheduleType').touched)">
                {{'polpCronJob.errors.scheduleTypeRequired' | cronJobHyperTrans}}
            </div>
        </div>
    </div>
    
    <div class="mb-3 row" *ngIf="visibiltyCfg.recurrence">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-recurrence'}}">
            {{'polpCronJob.recurrence' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <select class="form-control"
                    id="{{prefix + 'schedule-recurrence'}}"
                    formControlName="recurrence">
                <option selected value="">{{'polpCronJob.selectOne' | cronJobHyperTrans}}</option>
                <option value="{{opt.value}}" *ngFor="let opt of recurrenceOptions">
                    {{opt.text | cronJobHyperTrans}}
                </option>
            </select>
        </div>
    </div>

    <div class="mb-3 row" *ngIf="visibiltyCfg.recurrence && visibiltyCfg.customExpr">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-custom-expr'}}">
            {{'polpCronJob.customExpr' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <input class="form-control"
                   type="text"
                   [autofocus]="true"
                   id="{{prefix + 'schedule-custom-expr'}}"
                   aria-describedby="{{prefix + 'schedule-custom-expr-helper'}}"
                   formControlName="customExpr">
            <div id="{{prefix + 'schedule-custom-expr-helper'}}"
                 class="form-text text-warning d-block my-1"
                 *ngIf="form.hasError('customExpr') && (form.get('customExpr').dirty || form.get('customExpr').touched)">
                {{'polpCronJob.errors.customExprInvalid' | cronJobHyperTrans}}
            </div>
        </div>
    </div>

    <div class="mb-3 row" *ngIf="visibiltyCfg.startDate">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-start-date'}}">
            {{'polpCronJob.startDate' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <input class="form-control"
                   type="text"
                   id="{{prefix + 'schedule-start-date'}}"
                   bsDatepicker
                   [bsConfig]="{ adaptivePosition: true }"
                   formControlName="startDate">
        </div>
    </div>


    <div class="mb-3 row" *ngIf="visibiltyCfg.monthOfYear">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-month-of-year'}}">
            {{'polpCronJob.monthOfYear' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <select class="form-control"
                    id="{{prefix + 'schedule-month-of-year'}}"
                    formControlName="monthOfYear">
                <option selected>...</option>
                <option value="{{opt.value}}" *ngFor="let opt of monthsOfYearOptions">
                    {{opt.text | cronJobHyperTrans}}
                </option>
            </select>
        </div>
    </div>

    <div class="mb-3 row" *ngIf="visibiltyCfg.dayOfMonth">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-day-of-month'}}">
            {{'polpCronJob.dayOfMonth' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <select class="form-control"
                    id="{{prefix + 'schedule-day-of-month'}}"
                    formControlName="dayOfMonth">
                <option selected value="">...</option>
                <option value="{{opt.value}}" *ngFor="let opt of daysOfMonthOptions">
                    {{opt.text}}
                </option>
            </select>
        </div>
    </div>


    <div class="mb-3 row" *ngIf="visibiltyCfg.dayOfWeek">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-day-of-week'}}">
            {{'polpCronJob.dayOfWeek' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <select class="form-control"
                    id="{{prefix + 'schedule-day-of-week'}}"
                    formControlName="dayOfWeek">
                <option selected value="">...</option>
                <option value="{{opt.value}}" *ngFor="let opt of daysOfWeekOptions">
                    {{opt.text | cronJobHyperTrans}}
                </option>
            </select>
        </div>
    </div>

    <div class="mb-3 row" *ngIf="visibiltyCfg.time">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-time'}}">
            {{'polpCronJob.time' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <timepicker id="{{prefix + 'schedule-time'}}"
                        formControlName="time">
            </timepicker>
        </div>
    </div>

    <div class="mb-3 row" *ngIf="visibiltyCfg.excludeHolidays">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-exclude-holidays'}}">
            {{'polpCronJob.excludeHolidays' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <div class="form-check">
                <input class="form-check-input position-static"
                       type="checkbox"
                       id="{{prefix + 'schedule-exclude-holidays'}}"
                       formControlName="excludeHolidays">
            </div>
            <div *ngIf="isHolidaysExcluded">
                {{holidays}}
                <span *ngIf="!holidays">{{'polpCronJob.notSetYet' | cronJobHyperTrans}}</span>
                <button class="btn btn-link text-info" (click)="updateHolidaysAsync()">
                    {{'polpCronJob.editBtn' | cronJobHyperTrans}}
                </button>
            </div>
        </div>
    </div>
    <div class="mb-3 row" *ngIf="visibiltyCfg.excludeWeekends">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-exclude-weekends'}}">
            {{'polpCronJob.excludeWeekends' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <div class="form-check">
                <input class="form-check-input position-static"
                       type="checkbox"
                       id="{{prefix + 'schedule-exclude-weekends'}}"
                       formControlName="excludeWeekends">
            </div>
        </div>
    </div>
    <div class="mb-3 row" *ngIf="visibiltyCfg.excludeOthers">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-exclude-others'}}">
            {{'polpCronJob.excludeOthers' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <div class="form-check">
                <input class="form-check-input position-static"
                       id="{{prefix + 'schedule-exclude-others'}}"
                       type="checkbox"
                       formControlName="excludeOthers">
            </div>
            <div *ngIf="isOthersExcluded">
                {{otherDays}}
                <span *ngIf="!otherDays">{{'polpCronJob.notSetYet' | cronJobHyperTrans}}</span>
                <button class="btn btn-link text-info" (click)="updateOtherDaysAsync()">
                    {{'polpCronJob.editBtn' | cronJobHyperTrans}}
                </button>
            </div>
        </div>
    </div>

    <div class="mb-3 row" *ngIf="visibiltyCfg.endDate">
        <label class="col-12 col-md-4 col-form-label"
               for="{{prefix + 'schedule-end-date'}}">
            {{'polpCronJob.endDate' | cronJobHyperTrans}}
        </label>
        <div class="col-12 col-md-8">
            <input class="form-control"
                   type="text"
                   id="{{prefix + 'schedule-end-date'}}"
                   bsDatepicker
                   [bsConfig]="{ adaptivePosition: true }"
                   formControlName="endDate">
        </div>
    </div>

    <ng-container *ngFor="let a of alerts">
        <alert [type]="a.type" [dismissOnTimeout]="a.timeout">
            {{a.message | cronJobHyperTrans}}
        </alert>
    </ng-container>
    
    <div class="d-flex justify-content-end mb-4" *ngIf="!hideSubmitBtn || !hideCancelBtn">
        <button type="button" class="btn btn-warning"
                (click)="cancel()" *ngIf="!hideCancelBtn">
            {{'polpCronJob.cancelBtn' | cronJobHyperTrans}}
        </button>
        <button type="submit" class="btn btn-success"
                *ngIf="!hideSubmitBtn">
            {{'polpCronJob.submitBtn' | cronJobHyperTrans}}
        </button>
    </div>
</form>
