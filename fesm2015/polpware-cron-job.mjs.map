<form (ngSubmit)="confirm()">
    <div class="mb-4">
        <label class="form-label"
               for="{{prefix + 'tag-input'}}">
            {{'polpCronJob.inputDate' | cronJobHyperTrans}}
        </label>
        
        <div class="input-group">
            <input type="text"
                   class="form-control"
                   id="{{prefix + 'tag-input'}}"
                   bsDatepicker
                   [bsConfig]="{ adaptivePosition: true }"
                   [ngModelOptions]="{standalone: true}"
                   [(ngModel)]="bsValue">
            <button type="submit" class="btn btn-info">
                {{'polpCronJob.confirmBtn' | cronJobHyperTrans}}
            </button>
        </div>
    </div>
</form>



<form [formGroup]="form">
    <tag-input
        [formControlName]="'chips'">
    </tag-input>
</form>
