<div class="modal-header" polpModalDraggable>
    <h4 class="modal-title">{{title | cronJobHyperTrans}}</h4>
</div>
<div class="modal-body">
    <polp-bs-schedule-time-picker [initSettings]="initSettings"
                                  [initValue]="initValue"
                                  (childStateChanged)="updateStyle($event)"
                                  (onValidation)="validateScheduler($event)"
                                  (onValueChanged)="updateScheduler($event)">
    </polp-bs-schedule-time-picker>
    
    <ng-container *ngFor="let a of alerts">
        <alert [type]="a.type" [dismissOnTimeout]="a.timeout">
            {{a.message | cronJobHyperTrans}}
        </alert>
    </ng-container>
    
</div>
<div class="modal-footer">
    <div class="d-flex justify-content-end">
        <button class="btn btn-secondary me-2" (click)="close()">
            {{'polpCronJob.closeBtn' | cronJobHyperTrans}}
        </button>
        <button type="button" class="btn btn-primary" *ngIf="isValid"
                (click)="confirmAsync()">
            {{'polpCronJob.confirmBtn' | cronJobHyperTrans}}
            <fa-icon [icon]="faSpinner" [spin]="true" class="ms-1" *ngIf="isSaving"></fa-icon>
        </button>
    </div>
</div>
