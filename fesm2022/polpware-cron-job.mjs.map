<div class="modal-header" polpModalDraggable>
    <h4 class="modal-title">{{title | cronJobHyperTrans}}</h4>
</div>
<div class="modal-body">
    <polp-bs-multi-date-picker [initValue]="initValue"
                               (onValidation)="validate($event)"
                               (onValueChanged)="updateValue($event)">
    </polp-bs-multi-date-picker>
    
    <ng-container *ngFor="let a of alerts">
        <alert [type]="a.type" [dismissOnTimeout]="a.timeout">
            {{a.message | cronJobHyperTrans}}
        </alert>
    </ng-container>
    
</div>
<div class="modal-footer">
    <div class="d-flex justify-content-end">
        <button class="btn btn-secondary me-2" (click)="close()">
            {{'polpCronJob.cancelBtn' | cronJobHyperTrans}}
        </button>
        <button type="button" class="btn btn-primary" *ngIf="isValid"
                (click)="confirm()">
            {{'polpCronJob.confirmBtn' | cronJobHyperTrans}}
        </button>
    </div>
</div>
